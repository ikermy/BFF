# =============================================================================
# Envoy — конфигурация для режима разработки (dev)
# =============================================================================
#
# Роль:
#   Единая точка TLS-терминации и маршрутизации для BFF (сервиса-оркестратора)
#   и Nuxt-фронтенда. Внешние клиенты обращаются через Envoy по TLS.
#
# Listeners:
#   :80    — HTTP → 301 redirect на HTTPS
#   :443   — HTTPS → plain HTTP → bff:8080
#             Сертификат: /etc/envoy/certs/localhost.pem / localhost-key.pem
#   :9901  — Envoy Admin API (только 127.0.0.1)
#
# Маршруты (домен "*"):
#   /api/v1/*   → bff        (публичный API фронтенда)
#   /admin/*    → bff        (админ-панель, Admin JWT)
#   /internal/* → bff        (внутренние ручки, Service Token)
#   /artifacts/ → bff        (статическая раздача переложенных PNG)
#   /health, /metrics → bff
#   /*          → frontend   (Nuxt-статика/SSR)
#
# Сертификаты монтируются отдельными файлами из envoy/certs
# (см. docker-compose.yml), как в рабочем air_orchestrator.
# =============================================================================

static_resources:

  listeners:

    # ─────────────────────────────────────────────────────────────────────────
    # Listener 1: HTTP (:80) → 301 redirect на HTTPS
    # ─────────────────────────────────────────────────────────────────────────
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                use_remote_address: true
                route_config:
                  name: http_route
                  virtual_hosts:
                    - name: http
                      domains: [ "*" ]
                      routes:
                        - match:
                            prefix: "/"
                          redirect:
                            https_redirect: true
                            response_code: MOVED_PERMANENTLY
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ─────────────────────────────────────────────────────────────────────────
    # Listener 2: HTTPS (:443) → plain HTTP → bff:8080
    # ─────────────────────────────────────────────────────────────────────────
    - name: https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/localhost.pem
                    private_key:
                      filename: /etc/envoy/certs/localhost-key.pem
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                use_remote_address: true
                route_config:
                  name: https_route
                  virtual_hosts:
                    - name: bff
                      domains: [ "*" ]
                      # CORS (dev) — Envoy сам отвечает на preflight OPTIONS.
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              google_re2: { }
                              regex: ".*"
                        allow_methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
                        allow_headers: "content-type, authorization, x-idempotency-key, x-service-key"
                        allow_credentials: true
                        max_age: "3600"
                        filter_enabled:
                          default_value:
                            numerator: 100
                            denominator: HUNDRED
                      routes:
                        - match:
                            prefix: "/health"
                          route:
                            cluster: bff_http
                            timeout: 5s
                        - match:
                            prefix: "/metrics"
                          route:
                            cluster: bff_http
                            timeout: 5s
                        - match:
                            prefix: "/api/v1"
                          route:
                            cluster: bff_http
                            timeout: 30s
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match:
                            prefix: "/admin"
                          route:
                            cluster: bff_http
                            timeout: 30s
                        - match:
                            prefix: "/internal"
                          route:
                            cluster: bff_http
                            timeout: 30s
                        # Переложенные PNG (D2 этап 2)
                        - match:
                            prefix: "/artifacts/"
                          route:
                            cluster: bff_http
                            timeout: 10s
                        # Дефолт — Nuxt-фронтенд (тот же origin, API по /api/v1)
                        - match:
                            prefix: "/"
                          route:
                            cluster: frontend_http
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

    # BFF (оркестратор) — plain HTTP внутри Docker-сети.
    - name: bff_http
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: bff_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: bff
                      port_value: 8080

    # Nuxt-фронтенд (nginx, раздающий статический build или Nuxt SSR).
    - name: frontend_http
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: frontend_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: frontend
                      port_value: 80

# ─────────────────────────────────────────────────────────────────────────────
# Admin API — только для отладки, не публикуется наружу
# http://localhost:9901/stats, /clusters, /config_dump
# ─────────────────────────────────────────────────────────────────────────────
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
