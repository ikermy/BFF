# =============================================================================
# docker-compose.prod.yml — prod-оверлей поверх docker-compose.yml
# =============================================================================
#
# Использование:
#   DOMAIN=example.com docker compose \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Что делает:
#   - Переопределяет сервис envoy на prod-конфиг (Let's Encrypt, watched_directory),
#     подставляя DOMAIN вместо DOMAIN_PLACEHOLDER в envoy.prod.yaml.
#   - Добавляет acme_http (nginx) — отдаёт ACME challenge.
#   - Добавляет certbot — фоновое автообновление сертификатов (каждые 12ч).
#
# Первоначальное получение сертификата: ./envoy/certbot-init.sh <domain> <email>
# =============================================================================

services:

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    container_name: barcode_envoy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Одна строка: sed-подстановка DOMAIN в /tmp/envoy.yaml (записываемый путь), затем envoy.
    # НЕ пишем в /etc/envoy/envoy.yaml — в базовом compose этот путь смонтирован read-only.
    command: /bin/sh -c 'sed "s/DOMAIN_PLACEHOLDER/$${DOMAIN}/g" /etc/envoy/envoy.prod.yaml.template > /tmp/envoy.yaml && envoy -c /tmp/envoy.yaml'
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN required (e.g. example.com)}"
    volumes:
      - ./envoy/envoy.prod.yaml:/etc/envoy/envoy.prod.yaml.template:ro
      - barcode_certbot_certs:/etc/letsencrypt:ro
      - barcode_certbot_www:/var/www/certbot:ro
    depends_on:
      - bff
    networks:
      - barcode-shared

  # nginx — отдаёт ACME challenge файлы certbot (webroot)
  acme_http:
    image: nginx:1.27-alpine
    container_name: barcode_acme_http
    restart: unless-stopped
    volumes:
      - barcode_certbot_www:/usr/share/nginx/html:ro
    networks:
      - barcode-shared

  # certbot — фоновое автообновление сертификатов
  certbot:
    image: certbot/certbot:latest
    container_name: barcode_certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200; done"
    volumes:
      - barcode_certbot_certs:/etc/letsencrypt
      - barcode_certbot_www:/var/www/certbot
    networks:
      - barcode-shared

  # ─────────────────────────── Observability ─────────────────────────
  # Общий мониторинг платформы. Prometheus/Grafana и экспортёры живут здесь
  # (в оркестраторе bff), а не в отдельных микросервисах — чтобы не дублировать
  # копии и держать единый prometheus.yml с таргетами на все сервисы платформы.

  prometheus:
    image: prom/prometheus:latest
    container_name: barcode_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - barcode-shared

  grafana:
    image: grafana/grafana:latest
    container_name: barcode_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - barcode-shared

  # Экспортёр PostgreSQL → метрики в Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: barcode_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD:-billing}@postgres:5432/${POSTGRES_DB:-billing}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - barcode-shared

  # Экспортёр Redis → метрики в Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: barcode_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379/0"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      - redis
    networks:
      - barcode-shared

volumes:
  prometheus_data:
  grafana_data:
  # external: создаются скриптом certbot-init.sh (docker volume create bff_certbot_*).
  barcode_certbot_certs:
    external: true
    name: bff_certbot_certs
  barcode_certbot_www:
    external: true
    name: bff_certbot_www
