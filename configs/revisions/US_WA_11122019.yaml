name: US_WA_11122019
displayName: "Washington (Nov 2019)"
enabled: true
revisionEffectiveDate: "2019-11-12"
supportedModes: [prepare, auto, prepared]
renderAllowlist: [QQQ, DAC, DAD, DAG, DAI, DAJ, DAK, DAQ, DAU, DAW, DAY, DBA, DBB, DBC, DBD, DCA, DCB, DCD, DCF, DCJ, DCS, DDA, DDB, DDK, DDL]
defaults:
  QQQ: "DL"
  DAD: "NONE"
  DCA: "C"
  DCB: "NONE"
  DCD: "NONE"
  DBC: "1"
  DAY: "BRO"
  DAU: "510"
  DAW: "150"
  DAG: "1 MAIN ST"
  DAI: "CITY"
  DAK: "00000"
  DDA: "F"
  DDK: "NONE"
  DDL: "NONE"
requiredRenderFields: [DCJ]
requiredInputFields: [firstName, lastName, dateOfBirth]
# WA: DCJ (auditCode) генерируется из DBD; DCF требует DCJ.
generationSteps:
  - id: daq
    endpoint: random
    input: [DAJ]
    output: [DAQ]
  - id: dates
    endpoint: random
    input: [DAJ, DBB]
    output: [DBD, DBA]
  - id: audit
    endpoint: random
    input: [DAJ, DBD]
    output: [DCJ]
  - id: dck
    endpoint: calculate
    input: [DAJ, DBD, DAQ, DBA, DBB]
    output: [DCK]
  - id: dcf
    endpoint: calculate
    input: [DAJ, DBD, DBA, DAQ, DCJ]
    output: [DCF]
schema:
  fields:
    - {name: firstName, type: string, required: true, label: "First Name", order: 1}
    - {name: lastName, type: string, required: true, label: "Last Name", order: 2}
    - {name: dateOfBirth, type: date, required: true, label: "Date of Birth", order: 3, validation: {maxDate: "today-16y"}}
    - {name: street, type: string, required: false, label: "Street", order: 4}
    - {name: city, type: string, required: false, label: "City", order: 5}
    - {name: zipCode, type: string, required: false, label: "ZIP", order: 7}
    # auditCode генерируется (source=generated), редактируемый, обязателен перед render.
    - {name: auditCode, type: string, required: true, label: "Audit Information", order: 30}
