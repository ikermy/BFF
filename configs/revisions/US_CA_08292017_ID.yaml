schema:
  fields:
    - {name: firstName, type: string, required: true, label: "First Name", order: 1}
    - {name: middleName, type: string, required: false, label: "Middle Name", order: 2}
    - {name: lastName, type: string, required: true, label: "Last Name", order: 3}
