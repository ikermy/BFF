    - {name: zipCode, type: string, required: true, label: "ZIP/Postal", order: 7}
    - {name: dateOfBirth, type: date, required: true, label: "Date of Birth", order: 8, validation: {maxDate: "today-16y"}}
    - {name: sex, type: enum, required: false, label: "Sex", order: 9, options: ["1", "2"]}
    - {name: realId, type: enum, required: false, label: "Real ID", order: 10, options: ["", "N", "F"]}
    - {name: height, type: number, required: false, label: "Height (in)", order: 11}
    - {name: weightPounds, type: number, required: false, label: "Weight (lbs)", order: 12}
    - {name: eyeColor, type: enum, required: false, label: "Eye Color", order: 13, options: ["BLK", "BLU", "BRO", "DIC", "GRY", "GRN", "HAZ", "MAR", "PNK", "UNK"]}
    - {name: hairColor, type: enum, required: false, label: "Hair Color", order: 14, options: ["BAL", "RED", "BLK", "SDY", "BLN", "WHI", "BRO", "GRY", "UNK"]}
    - {name: organDonor, type: enum, required: false, label: "Organ Donor", order: 15, options: ["false", "true"]}
    - {name: veteran, type: enum, required: false, label: "Veteran", order: 16, options: ["false", "true"]}
