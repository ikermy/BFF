name: US_CA_08292017
displayName: "California Driver License (Aug 2017)"
enabled: true
revisionEffectiveDate: "2017-08-29"
supportedModes: [prepare, auto, prepared]
renderAllowlist: [DAJ, DDB, QQQ, DAC, DAD, DCS, DCU, DBB, DBD, DBA, DAQ, DAG, DAI, DAK, DAU, DAW, DAY, DAZ, DBC, DCA, DCB, DCD, DDA, DDK, DDL, DCK, DCF]
# static-константы профиля (engine-поля, которые CA-builder читает, но форма не собирает).
defaults:
  QQQ: "DL"
  DCA: "C"
  DCB: "NONE"
  DCD: "NONE"
  DBC: "1"
  DAY: "BRO"
  DAZ: "BRO"
  DAU: "510"
  DAW: "150"
  DAG: "1 MAIN ST"
  DAI: "LOS ANGELES"
  DAK: "90001"
requiredInputFields:
  - firstName
  - lastName
  - dateOfBirth
# Порядок derive (план §Калифорния): DAQ[DAJ] -> dates[DAJ,DBB] -> DCK[DAJ,DBD,DAQ] -> DCF[DAJ,DBD,DBA].
# calculate умеет только [DBA],[DCK],[DCF]; random — фиксированные наборы ([DAQ], [DBD,DBA], …).
generationSteps:
  - id: daq
    endpoint: random
    input: [DAJ]
    output: [DAQ]
  - id: dates
    endpoint: random
    input: [DAJ, DBB]
    output: [DBD, DBA]
  - id: dck
    endpoint: calculate
    # BarcodeGen DCK-guard требует DBD, DAQ, DBA, DBB (DAJ — для выбора профиля).
    input: [DAJ, DBD, DAQ, DBA, DBB]
    output: [DCK]
  - id: dcf
    endpoint: calculate
    input: [DAJ, DBD, DBA]
    output: [DCF]
schema:
  fields:
    - name: firstName
      type: string
      required: true
      label: "First Name"
      order: 1
      validation:
        minLength: 1
        maxLength: 40
        pattern: '^[A-Z][a-zA-Z\s''-]+$'
    - name: lastName
      type: string
      required: true
      label: "Last Name"
      order: 2
      validation:
        minLength: 1
        maxLength: 40
    - name: dateOfBirth
      type: date
      required: true
      label: "Date of Birth"
      order: 3
      validation:
        maxDate: "today-16y"
    - name: street
      type: string
      required: false
      label: "Street Address"
      order: 4
    - name: city
      type: string
      required: false
      label: "City"
      order: 5
    - name: zipCode
      type: string
      required: false
      label: "ZIP Code"
      order: 7
      validation:
        pattern: '^\d{5}(-\d{4})?$'
    - name: eyeColor
      type: enum
      required: true
      label: "Eye Color"
      order: 10
      options: [BLK, BLU, BRO, GRY, GRN, HAZ]
    - name: height
      type: string
      required: false
      label: "Height"
      order: 11
    - name: weight
      type: string
      required: false
      label: "Weight"
      order: 12
    - name: signatureUrl
      type: string
      required: false
      label: "Signature Image URL"
      order: 20
    - name: photoUrl
      type: string
      required: false
      label: "Photo Image URL"
      order: 21
  groups:
    - name: personal
      label: "Personal Information"
      fields: [firstName, lastName, dateOfBirth]
    - name: address
      label: "Address"
      fields: [street, city, state, zipCode]
    - name: physical
      label: "Physical Description"
      fields: [eyeColor, height, weight]
    - name: media
      label: "Media"
      fields: [signatureUrl, photoUrl]

