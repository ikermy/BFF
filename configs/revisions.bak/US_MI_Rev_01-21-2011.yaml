name: US_MI_Rev_01-21-2011
displayName: "Michigan (Rev 01-21-2011)"
enabled: true
revisionEffectiveDate: "2011-01-21"
supportedModes: [prepare, prepared]
# MI: DDB = literal "Rev 01-21-2011" (не преобразуется в 8 цифр), exact lookup по literal.
renderAllowlist: [QQQ, DAC, DAD, DAG, DAI, DAJ, DAK, DAQ, DBA, DBB, DBC, DBD, DCK, DCS, DDA, DDB]
defaults:
  QQQ: "DL"
  DAD: "NONE"
  DAG: "1 MAIN ST"
  DAI: "CITY"
  DAK: "00000"
  DBC: "1"
  DDA: "F"
requiredInputFields: [firstName, lastName, dateOfBirth]
# MI: DDB = literal "Rev 01-21-2011". Derive dates + DCK (DCF не читается builder'ом).
generationSteps:
  - id: daq
    endpoint: random
    input: [DAJ]
    output: [DAQ]
  - id: dates
    endpoint: random
    input: [DAJ, DBB]
    output: [DBD, DBA]
  - id: dck
    endpoint: calculate
    input: [DAJ, DBD, DAQ, DBA, DBB]
    output: [DCK]
schema:
  fields:
    - {name: firstName, type: string, required: true, label: "First Name", order: 1}
    - {name: lastName, type: string, required: true, label: "Last Name", order: 2}
    - {name: dateOfBirth, type: date, required: true, label: "Date of Birth", order: 3, validation: {maxDate: "today-16y"}}
    - {name: street, type: string, required: false, label: "Street", order: 4}
    - {name: city, type: string, required: false, label: "City", order: 5}
    - {name: zipCode, type: string, required: false, label: "ZIP", order: 7}
