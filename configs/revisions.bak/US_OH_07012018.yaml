name: US_OH_07012018
displayName: "Ohio (Jul 2018)"
enabled: true
revisionEffectiveDate: "2018-07-01"
supportedModes: [prepare, auto, prepared]
# OH: DAX (кг) вычисляется BarcodeGen из DAW (фунты); frontend спрашивает только weightPounds.
renderAllowlist: [QQQ, DAC, DAD, DAG, DAI, DAJ, DAK, DAQ, DAU, DAW, DAX, DAY, DAZ, DBA, DBB, DBC, DBD, DCA, DCB, DCD, DCF, DCK, DCS, DCU, DDA, DDB, DDK, DDL]
defaults:
  QQQ: "DL"
  DAD: "NONE"
  DCA: "C"
  DCB: "NONE"
  DCD: "NONE"
  DBC: "1"
  DAY: "BRO"
  DAZ: "BRO"
  DAU: "510"
  DAW: "150"
  DAG: "1 MAIN ST"
  DAI: "CITY"
  DAK: "00000"
  DDA: "F"
  DDK: "NONE"
  DDL: "NONE"
  DCU: "NONE"
requiredInputFields: [firstName, lastName, dateOfBirth]
# OH: DAX (кг) вычисляется BarcodeGen из DAW. Полная derive-цепочка как в CA.
generationSteps:
  - id: daq
    endpoint: random
    input: [DAJ]
    output: [DAQ]
  - id: dates
    endpoint: random
    input: [DAJ, DBB]
    output: [DBD, DBA]
  - id: dck
    endpoint: calculate
    input: [DAJ, DBD, DAQ, DBA, DBB]
    output: [DCK]
  - id: dcf
    endpoint: calculate
    input: [DAJ, DBD, DBA]
    output: [DCF]
schema:
  fields:
    - {name: firstName, type: string, required: true, label: "First Name", order: 1}
    - {name: lastName, type: string, required: true, label: "Last Name", order: 2}
    - {name: dateOfBirth, type: date, required: true, label: "Date of Birth", order: 3, validation: {maxDate: "today-16y"}}
    - {name: street, type: string, required: false, label: "Street", order: 4}
    - {name: city, type: string, required: false, label: "City", order: 5}
    - {name: zipCode, type: string, required: false, label: "ZIP", order: 7}
    - {name: weightPounds, type: number, required: false, label: "Weight (lbs)", order: 13}
