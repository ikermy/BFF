
services:
  # ───────────────────────────── BFF API ─────────────────────────────
  bff:
    image: "${DOCKER_IMAGE:-bff:dev}"
    build:
      context: .
      target: api
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs
      - ./artifacts:/app/artifacts
    environment:
      BFF_PORT: "${BFF_PORT:-8080}"
      INTERNAL_SERVICE_JWT: "${INTERNAL_SERVICE_JWT:-dev-internal-token}"
      ADMIN_JWT: "${ADMIN_JWT:-dev-admin-token}"
      UNIT_PRICE: "${UNIT_PRICE:-0.50}"
      # Auth / внутренние токены (grpc_kafka_fixes §1.1, отчёт §4.2 п.1)
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-dev-barcodegen-access-secret}"
      # BarcodeGen: режим legacy-адаптера (ACL под реальный BarcodeGen, отчёт §4)
      BARCODEGEN_MODE: "${BARCODEGEN_MODE:-legacy}"
      BARCODEGEN_URL: "${BARCODEGEN_URL:-http://barcodegen:8080}"
      BARCODEGEN_RAW_URL: "${BARCODEGEN_RAW_URL:-}"
      BARCODEGEN_TIMEOUT: "${BARCODEGEN_TIMEOUT:-30000}"
      # Перекладка артефактов PNG (D2 этап 2, отчёт §4.3)
      ARTIFACT_DIR: "${ARTIFACT_DIR:-/app/artifacts}"
      ARTIFACT_PUBLIC_URL: "${ARTIFACT_PUBLIC_URL:-}"
      # Services (согласно ТЗ)
      BILLING_URL: "${BILLING_URL:-http://billing:3000}"
      BILLING_INTERNAL_API_KEY: "${BILLING_INTERNAL_API_KEY:-dev-billing-key}"
      AI_URL: "${AI_URL:-http://ai-service:8080}"
      HISTORY_URL: "${HISTORY_URL:-http://history:3000}"
      # Legacy services (согласно ТЗ)
      AUTH_URL: "${AUTH_URL:-http://auth-service:3000}"
      # Auth Service (gRPC) — межсервисные операции (getPublicProfile, findUserByUsername)
      AUTH_GRPC_URL: "${AUTH_GRPC_URL:-auth-service:50051}"
      # Dev-дефолт совпадает с dev SERVICE_API_KEYS в auth/.env. Для прод задаётся из secrets.
      AUTH_SERVICE_KEY: "${AUTH_SERVICE_KEY:-dev-shared-auth-service-key}"
      NOTIFICATIONS_URL: "${NOTIFICATIONS_URL:-http://notifications:3000}"
      TRANS_HISTORY_URL: "${TRANS_HISTORY_URL:-http://trans-history:3000}"
      # Kafka
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      KAFKA_GROUP_ID: "${KAFKA_GROUP_ID:-bff-bulk-worker}"
      # Redis
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      # Timeouts (ms)
      BILLING_TIMEOUT: "${BILLING_TIMEOUT:-5000}"
      AI_TIMEOUT: "${AI_TIMEOUT:-60000}"
      # Idempotency TTL (seconds → 24h)
      IDEMPOTENCY_TTL: "${IDEMPOTENCY_TTL:-86400}"
      # Feature flags
      ENABLE_PARTIAL_SUCCESS: "${ENABLE_PARTIAL_SUCCESS:-true}"
      ENABLE_IDEMPOTENCY: "${ENABLE_IDEMPOTENCY:-true}"
      ENABLE_LEGACY_AUTH: "${ENABLE_LEGACY_AUTH:-true}"
      ENABLE_NOTIFICATIONS: "${ENABLE_NOTIFICATIONS:-true}"
      # Rollback / maintenance
      MAINTENANCE_MODE: "${MAINTENANCE_MODE:-false}"
    depends_on:
      - kafka
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - barcode-shared

  # ─────────────────────────── BFF Worker ────────────────────────────
  worker:
    image: "${DOCKER_IMAGE_WORKER:-bff-worker:dev}"
    build:
      context: .
      target: worker
    volumes:
      - ./configs:/app/configs
    environment:
      UNIT_PRICE: "${UNIT_PRICE:-0.50}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-dev-barcodegen-access-secret}"
      BARCODEGEN_MODE: "${BARCODEGEN_MODE:-legacy}"
      BARCODEGEN_URL: "${BARCODEGEN_URL:-http://barcodegen:8080}"
      BARCODEGEN_RAW_URL: "${BARCODEGEN_RAW_URL:-}"
      BARCODEGEN_TIMEOUT: "${BARCODEGEN_TIMEOUT:-30000}"
      BILLING_URL: "${BILLING_URL:-http://billing:3000}"
      BILLING_INTERNAL_API_KEY: "${BILLING_INTERNAL_API_KEY:-dev-billing-key}"
      AI_URL: "${AI_URL:-http://ai-service:8080}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      KAFKA_GROUP_ID: "${KAFKA_GROUP_ID:-bff-bulk-worker}"
      BILLING_TIMEOUT: "${BILLING_TIMEOUT:-5000}"
      AI_TIMEOUT: "${AI_TIMEOUT:-60000}"
      ENABLE_PARTIAL_SUCCESS: "${ENABLE_PARTIAL_SUCCESS:-true}"
      ENABLE_NOTIFICATIONS: "${ENABLE_NOTIFICATIONS:-true}"
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - barcode-shared

  # ──────────────────────────── Kafka ────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - barcode-shared

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - barcode-shared

  # ──────────────────────────── Redis ────────────────────────────────
  redis:
    image: redis:7.2-alpine
    # Хост-порт не публикуем: на хосте может быть свой redis на 6379 (конфликт).
    # BFF ходит в redis по docker-сети (redis:6379), внешний доступ не требуется.
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - barcode-shared

  # ──────────────────────────── Envoy (dev) ──────────────────────────
  # Единая точка TLS-терминации и маршрутизации для BFF (оркестратора).
  # Сертификаты: ./envoy/gen-certs.sh → envoy/certs/*.pem
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    container_name: barcode_envoy
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./envoy/envoy.dev.yaml:/etc/envoy/envoy.yaml:ro
      # Сертификаты монтируются отдельными файлами (как в air_orchestrator) —
      # так envoy корректно читает их на Windows Docker Desktop.
      - ./envoy/certs/localhost.pem:/etc/envoy/certs/localhost.pem:ro
      - ./envoy/certs/localhost-key.pem:/etc/envoy/certs/localhost-key.pem:ro
      - ./envoy/certs/host.pem:/etc/envoy/certs/host.pem:ro
      - ./envoy/certs/host-key.pem:/etc/envoy/certs/host-key.pem:ro
    depends_on:
      - bff
    networks:
      - barcode-shared

  # ──────────────────────────── PostgreSQL ─────────────────────────────
  # БД платформы (Billing). Схема применяется сервисом migrate (Prisma).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-billing}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-billing}"
      POSTGRES_DB: "${POSTGRES_DB:-billing}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-billing} -d $${POSTGRES_DB:-billing}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - barcode-shared

  # ──────────────────────────── pgAdmin (dev) ──────────────────────────
  # Dev-инструмент для просмотра PostgreSQL. Только для локальной разработки.
  # Нестандартный хост-порт 54550 → 80, чтобы не пересекаться с другими
  # pgAdmin / админ-панелями на хосте.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bff_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@localhost}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-pgadmin}"
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - "54550:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - barcode-shared

  # ──────────────────────────── DB Migration ───────────────────────────
  # Разовая миграция: применяет Prisma-миграции (db/prisma) к PostgreSQL.
  # Запускается после postgres (healthy) и завершается.
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile.migrate
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-billing}:${POSTGRES_PASSWORD:-billing}@postgres:5432/${POSTGRES_DB:-billing}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - barcode-shared

volumes:
  zookeeper-data:
  kafka-data:
  redis-data:
  postgres-data:
  pgadmin-data:

networks:
  # Общая именованная сеть для связи с остальными контейнерами платформы
  # (barcodegen, billing, history, auth, ai-service и др. — отдельные compose-проекты).
  # external: сеть создаётся заранее (деплой: docker network create barcode_shared,
  # либо локально вручную), compose её только использует. Так избегаем конфликта
  # "network exists but was not created by compose". Другие проекты подключаются:
  #   networks:
  #     default:
  #       external: true
  #       name: barcode_shared
  barcode-shared:
    external: true
    name: barcode_shared

