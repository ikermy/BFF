name: Deploy BFF Production
on:
  push:
    branches:
      - master
env:
  REGISTRY: ghcr.io
  IMAGE: bff
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push BFF API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:prod
      - name: Build and push BFF Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}-worker:prod
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy compose & configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,envoy/,configs/,db/"
          target: "/barcode/bff"
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /barcode/bff
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p envoy configs

            # ── Общая сеть платформы (оркестратор создаёт её первой) ──
            docker network inspect barcode_shared >/dev/null 2>&1 || docker network create barcode_shared

            # ── .env доступен по пути /barcode/bff/.env ──
            echo "DOCKER_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ github.sha }}" > .env
            echo "DOCKER_IMAGE_WORKER=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}-worker:${{ github.sha }}" >> .env
            echo "BFF_PORT=8080" >> .env
            echo "UNIT_PRICE=${{ vars.UNIT_PRICE }}" >> .env
            # Обязательные для прод; при пустом секрете используется дефолт compose (тестовый запуск).
            echo "INTERNAL_SERVICE_JWT=${{ secrets.INTERNAL_SERVICE_JWT }}" >> .env
            echo "ADMIN_JWT=${{ secrets.ADMIN_JWT }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env
            echo "BARCODEGEN_MODE=${{ vars.BARCODEGEN_MODE }}" >> .env
            echo "BARCODEGEN_URL=${{ secrets.BARCODEGEN_URL }}" >> .env
            echo "BARCODEGEN_RAW_URL=${{ secrets.BARCODEGEN_RAW_URL }}" >> .env
            echo "BILLING_URL=${{ secrets.BILLING_URL }}" >> .env
            echo "BILLING_INTERNAL_API_KEY=${{ secrets.BILLING_INTERNAL_API_KEY }}" >> .env
            echo "AI_URL=${{ secrets.AI_URL }}" >> .env
            echo "HISTORY_URL=${{ secrets.HISTORY_URL }}" >> .env
            echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
            echo "NOTIFICATIONS_URL=${{ secrets.NOTIFICATIONS_URL }}" >> .env
            echo "TRANS_HISTORY_URL=${{ secrets.TRANS_HISTORY_URL }}" >> .env
            echo "KAFKA_BROKERS=${{ secrets.KAFKA_BROKERS }}" >> .env
            echo "KAFKA_GROUP_ID=${{ secrets.KAFKA_GROUP_ID }}" >> .env
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "ARTIFACT_DIR=/app/artifacts" >> .env
            echo "ARTIFACT_PUBLIC_URL=${{ secrets.ARTIFACT_PUBLIC_URL }}" >> .env
            echo "ENABLE_PARTIAL_SUCCESS=${{ vars.ENABLE_PARTIAL_SUCCESS }}" >> .env
            echo "ENABLE_IDEMPOTENCY=${{ vars.ENABLE_IDEMPOTENCY }}" >> .env
            echo "ENABLE_LEGACY_AUTH=${{ vars.ENABLE_LEGACY_AUTH }}" >> .env
            echo "ENABLE_NOTIFICATIONS=${{ vars.ENABLE_NOTIFICATIONS }}" >> .env
            echo "MAINTENANCE_MODE=${{ vars.MAINTENANCE_MODE }}" >> .env
            echo "DOMAIN=${{ secrets.DOMAIN }}" >> .env
            chmod 600 .env

            # ⚠️ Рекомендуется для прода: задать реальные значения этих секретов.
            # При пустых значениях .env — Docker Compose применяет дефолты из docker-compose.yml.

            # ── Деплой приложения (образы тянутся из ghcr.io, на сервере не собираются) ──
            docker compose -f docker-compose.yml pull bff worker postgres
            # Поднимаем инфраструктуру + БД + миграцию, затем приложение.
            docker compose -f docker-compose.yml up -d postgres
            docker compose -f docker-compose.yml run --rm migrate
            docker compose -f docker-compose.yml up -d bff worker kafka redis zookeeper
            docker compose -f docker-compose.yml ps
            docker run --rm --network barcode_shared curlimages/curl:8.10.1 -fsS http://bff:8080/health >/dev/null

            # ── Envoy (prod): TLS-терминация + маршрутизация на bff/frontend ──
            # Первичное получение Let's Encrypt-сертификата, если его ещё нет.
            if ! docker run --rm -v bff_certbot_certs:/certs alpine sh -c 'test -d /certs/live' >/dev/null 2>&1; then
              echo "Obtaining Let's Encrypt certificate for ${{ secrets.DOMAIN }}..."
              # bash-вызов: scp не сохраняет бит исполнения (x).
              DOMAIN="${{ secrets.DOMAIN }}" bash ./envoy/certbot-init.sh \
                || echo "certbot-init failed (проверьте DNS/порт 80); сертификат нужно получить вручную"
            fi
            # Поднимаем envoy + acme + certbot (прод-конфиг).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d envoy acme_http certbot
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps envoy acme_http certbot
            docker image prune -f
